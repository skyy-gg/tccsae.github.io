<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signIn</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/signIn.css">
</head>
<body>

    <header class="header">
       <a href="/">Voltar</a>
    </header>

    <main>
        <form action="#" method="#">
            
            <h2>Registrar-se</h2>

            <label for="Email" class="label">E-mail</label>
            <input type="email" name="Email" placeholder="Email" id="emailContainer" required>
            
            <label for="User" class="label">Usuário</label>
            <input type="text" name="Usuário" placeholder="Usuário" id="userContainer" required>
            
            <label for="Password" class="label">Senha</label>
            <input type="password" name="Password" placeholder="Senha" id="passwordContainer" required>
            
            <label for="confirmPassword" class="label">Confirme a senha</label>
            <input type="password" name="confirmPassword" placeholder="Confirme a senha" id="passwordConfirmationContainer" required>

            <button>Criar Conta</button>
        
        </form>
        
    </main>

    <p>Já tem uma conta?</p><a href="login.html">Fazer Login</a>
    

    <script src="js/signIn.js"></script>
</body>
</html>
