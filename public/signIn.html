<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <main>
        <form action="#" method="#">
            
            <h2>Registrar-se</h2>

            <label for="Email">E-mail</label>
            <input type="email" name="Email" placeholder="Email">
            
            <label for="User">Usuário</label>
            <input type="text" name="Usuário" placeholder="Usuário">
            
            <label for="Password">Senha</label>
            <input type="password" name="Password" placeholder="Senha">
            
            <label for="confirmPassword">Confirme a senha</label>
            <input type="password" name="confirmPassword" placeholder="Confirme a senha">

            <button type="submit">Criar Conta</button>
        
        </form>
        
    </main>

    <p>Já tem uma conta?</p><a href="login.html">Fazer Login</a>
    <a href="index.html">Voltar para a tela inicial</a>

</body>
</html>
