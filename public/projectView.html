<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vizualização do Projeto</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <header>
        <nav>
            <a href="home.html" id="home">Home</a>
        </nav>
        <h1 class="title">Visualização de Projeto</h1>
    </header>

    <main>

        <section>
            <button>Adicionar membro ao projeto</button>
        </section>

        <section id="commitContainer">

            <div id="projectName">
                <h2>Projeto</h2>
            </div>
            
            <div id="author">
                <img src="img/user.png" alt="User">
                <p>Nome do autor</p>
            </div>

            <div>
                <p>Commit</p>
            </div>

        </section>

        <section id="filesContainer">

            <table>

                <thead>
                    <th class="tableHeader">Nome</th>
                    <th class="tableHeader">Data</th>
                    <th class="tableHeader">Autor</th>
                </thead>
                <tbody>
                    <tr>
                        <td class="tableData">Documento de Texto Genérico</td>
                        <td class="tableData">dd|mm|yy</td>
                        <td class="tableData">Eu mesmo</td>
                    </tr>
                </tbody>
                
            </table>

        </section>
        

    </main>

</body>
