<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signIn</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/signIn.css">
</head>
<body>

    <main class="signin-wrapper">
        <div class="signin-card">
            <form action="#" method="#">
                
                <h2>Registrar-se</h2>

                <div class="form-group">
                    <label for="Email" class="label">E-mail</label>
                    <input type="email" name="Email" placeholder="Email" class="input" id="emailContainer" required>
                </div>
                
                <div class="form-group">
                    <label for="User" class="label">Usuário</label>
                    <input type="text" name="Usuário" placeholder="Usuário" class="input" id="userContainer" required>
                </div>
                
                <div class="form-group">
                    <label for="Password" class="label">Senha</label>
                    <input type="password" name="Password" placeholder="Senha" class="input" id="passwordContainer" required>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword" class="label">Confirme a senha</label>
                    <input type="password" name="confirmPassword" placeholder="Confirme a senha" class="input" id="passwordConfirmationContainer" required>
                </div>

                <button class="btn-submit">Criar Conta</button>
            
            </form>
        </div>
    </main>
    
    <script src="js/signIn.js"></script>
</body>
</html>
