<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <main>
        <form action="#" method="#">
            
            <h2>Login</h2>

            <label for="Email" class="label">E-mail</label>
            <input type="email" name="E-mail" placeholder="E-mail" class="input" id="Email-Input">

            <label for="Password" class="label">Senha</label>
            <input type="password" name="Password" placeholder="Usuário" class="input" id="Password-Input">

            <button id="loginBtn" onclick="login()">Entrar</button>
        
        </form>
        
    </main>

    <p>Novo por aqui?</p><a href="signIn.html">Criar conta</a>
    <a href="/">Voltar para a tela inicial</a>

    <script src="js/login.js"></script>
</body>
</html>
